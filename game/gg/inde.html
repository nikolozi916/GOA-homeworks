<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <title>დაუჭირე კვადრატს</title>
    <style>
        body { text-align: center; font-family: sans-serif; background: #f0f0f0; overflow: hidden; }
        #game-area { width: 100vw; height: 80vh; position: relative; border: 2px solid #333; background: white; margin-top: 20px; }
        #target { width: 50px; height: 50px; background: #3498db; position: absolute; cursor: pointer; border-radius: 8px; transition: 0.2s; }
        .score-board { font-size: 24px; margin: 10px; }
    </style>
</head>
<body>

    <div class="score-board">ქულა: <span id="score">0</span></div>
    <p>მოარტყი კვადრატს!</p>
    
    <div id="game-area">
        <div id="target"></div>
    </div>

    <script>
        let score = 0;
        const target = document.getElementById('target');
        const scoreDisplay = document.getElementById('score');
        const gameArea = document.getElementById('game-area');

        function moveTarget() {
            const maxX = gameArea.clientWidth - 50;
            const maxY = gameArea.clientHeight - 50;
            
            const randomX = Math.floor(Math.random() * maxX);
            const randomY = Math.floor(Math.random() * maxY);
            
            target.style.left = randomX + 'px';
            target.style.top = randomY + 'px';
        }

        target.addEventListener('mousedown', (e) => {
            score++;
            scoreDisplay.textContent = score;
            moveTarget();
            e.stopPropagation(); // რომ ფონზე კლიკი არ ჩაითვალოს
        });

        gameArea.addEventListener('mousedown', () => {
            if (score > 0) score--;
            scoreDisplay.textContent = score;
        });

        // საწყისი პოზიცია
        moveTarget();
    </script>
</body>
</html>
