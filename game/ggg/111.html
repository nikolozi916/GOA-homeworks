<!DOCTYPE html>
<html>
<head>
    <title>2D Minecraft Mini</title>
    <style>
        body { margin: 0; overflow: hidden; background: #87CEEB; font-family: sans-serif; }
        canvas { display: block; }
        #inventory { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); 
                    background: rgba(0,0,0,0.5); padding: 10px; border-radius: 5px; color: white; }
    </style>
</head>
<body>
    <div id="inventory">მაუსის მარცხენა: დანგრევა | მარჯვენა: დადება | WASD: მოძრაობა</div>
    <canvas id="gameCanvas"></canvas>

<script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    const blockSize = 40;
    const world = [];
    const player = { x: 100, y: 100, w: 30, h: 60, vX: 0, vY: 0, speed: 4, jump: -12 };
    let gravity = 0.6;
    const keys = {};

    // სამყაროს გენერაცია
    for (let x = 0; x < canvas.width; x += blockSize) {
        for (let y = 0; y < canvas.height; y += blockSize) {
            if (y > canvas.height / 1.5) {
                let type = y < canvas.height / 1.5 + blockSize ? "#44aa44" : "#8B4513";
                world.push({ x, y, type });
            }
        }
    }

    window.onkeydown = e => keys[e.code] = true;
    window.onkeyup = e => keys[e.code] = false;

    // ბლოკების დანგრევა და დადება
    canvas.onmousedown = e => {
        const mouseX = Math.floor(e.clientX / blockSize) * blockSize;
        const mouseY = Math.floor(e.clientY / blockSize) * blockSize;
        
        if (e.button === 0) { // მარცხენა კლიკი - დანგრევა
            const index = world.findIndex(b => b.x === mouseX && b.y === mouseY);
            if (index !== -1) world.splice(index, 1);
        } else if (e.button === 2) { // მარჯვენა კლიკი - დადება
            world.push({ x: mouseX, y: mouseY, type: "#8B4513" });
        }
    };
    canvas.oncontextmenu = e => e.preventDefault(); // მენიუს გათიშვა

    function update() {
        if (keys['KeyA']) player.vX = -player.speed;
        else if (keys['KeyD']) player.vX = player.speed;
        else player.vX *= 0.8;

        if (keys['KeyW'] && player.onGround) {
            player.vY = player.jump;
            player.onGround = false;
        }

        player.vY += gravity;
        player.x += player.vX;
        player.y += player.vY;
        player.onGround = false;

        // კოლიზია ბლოკებთან
        world.forEach(b => {
            if (player.x < b.x + blockSize && player.x + player.w > b.x &&
                player.y < b.y + blockSize && player.y + player.h > b.y) {
                if (player.vY > 0) {
                    player.y = b.y - player.h;
                    player.vY = 0;
                    player.onGround = true;
                } else if (player.vY < 0) {
                    player.y = b.y + blockSize;
                    player.vY = 0;
                }
            }
        });
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        // ბლოკები
        world.forEach(b => {
            ctx.fillStyle = b.type;
            ctx.fillRect(b.x, b.y, blockSize, blockSize);
            ctx.strokeStyle = "rgba(0,0,0,0.1)";
            ctx.strokeRect(b.x, b.y, blockSize, blockSize);
        });

        // სტივ (მოთამაშე)
        ctx.fillStyle = "#3498db";
        ctx.fillRect(player.x, player.y, player.w, player.h);

        update();
        requestAnimationFrame(draw);
    }
    draw();
</script>
</body>
</html>
